x-app-common: &app-common
  image: clinic-hub-app:latest
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    networks:
      - app-backend
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinic_hub}
      POSTGRES_USER: ${POSTGRES_USER:-clinic_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinic_hub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-clinic_hub}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - app-backend
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    <<: *app-common
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-clinic_hub}:${POSTGRES_PASSWORD:-clinic_hub}@db:5432/${POSTGRES_DB:-clinic_hub}
      CACHE_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-backend
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery_worker:
    <<: *app-common
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-clinic_hub}:${POSTGRES_PASSWORD:-clinic_hub}@db:5432/${POSTGRES_DB:-clinic_hub}
      CACHE_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
    command: ["celery", "-A", "core.celery:app", "worker", "--loglevel=INFO"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-backend

  flower:
    <<: *app-common
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-clinic_hub}:${POSTGRES_PASSWORD:-clinic_hub}@db:5432/${POSTGRES_DB:-clinic_hub}
      CACHE_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
    command: ["celery", "-A", "core.celery:app", "flower", "--port=5555"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 5555), timeout=2).close()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:5555:5555"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - app-backend
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:

networks:
  app-backend:
