{% extends "base.html" %}

{% block title %}403 · Clinic Hub{% endblock %}

{% block content %}
    <section class="grid min-h-screen place-items-center px-4 py-12 sm:px-8">
        <div class="surface mx-auto w-full max-w-lg p-8 text-center">
            <div class="mx-auto grid size-16 place-items-center rounded-2xl bg-rose-100 text-rose-600">
                <i data-lucide="shield" class="size-8"></i>
            </div>
            <h1 class="mt-5 text-3xl font-extrabold tracking-tight text-slate-900">403</h1>
            <p class="mt-2 text-lg font-semibold text-slate-700">Access denied</p>
            <p class="mt-3 text-sm leading-6 text-slate-500">
                You don’t have permission to view this page.
                {% if request.path %}The path <span class="font-semibold text-slate-700">{{ request.path }}</span> is restricted.{% endif %}
            </p>
            <div class="mt-8 flex flex-wrap justify-center gap-3">
                <a href="javascript:history.back()" class="btn btn-ghost">Go back</a>
                <a href="/" class="btn btn-primary">Return to dashboard</a>
            </div>
        </div>
    </section>
{% endblock %}
