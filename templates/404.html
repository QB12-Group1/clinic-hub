{% extends "base.html" %}

{% block title %}404 · Clinic Hub{% endblock %}

{% block content %}
    <section class="grid min-h-screen place-items-center px-4 py-12 sm:px-8">
        <div class="surface mx-auto w-full max-w-lg p-8 text-center">
            <div class="mx-auto grid size-16 place-items-center rounded-2xl bg-primary/10 text-primary">
                <i data-lucide="search" class="size-8"></i>
            </div>
            <h1 class="mt-5 text-3xl font-extrabold tracking-tight text-slate-900">404</h1>
            <p class="mt-2 text-lg font-semibold text-slate-700">Page not found</p>
            <p class="mt-3 text-sm leading-6 text-slate-500">
                The page you’re looking for doesn’t exist or may have been moved.
                {% if request.path %}We can’t find <span class="font-semibold text-slate-700">{{ request.path }}</span>.{% endif %}
            </p>
            <div class="mt-8 flex flex-wrap justify-center gap-3">
                <a href="javascript:history.back()" class="btn btn-ghost">Go back</a>
                <a href="/" class="btn btn-primary">Back to dashboard</a>
            </div>
        </div>
    </section>
{% endblock %}
