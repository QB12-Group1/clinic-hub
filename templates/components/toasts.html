<div x-data class="pointer-events-none fixed right-4 top-4 z-[100] flex flex-col gap-3 sm:right-6 sm:top-6">
    {% for message in messages %}
        <div x-data="{ show: true }" x-init="setTimeout(() => show = false, 5000)" x-show="show"
             x-transition:enter="transition ease-out duration-300" x-transition:enter-start="translate-x-5 opacity-0"
             x-transition:leave="transition ease-in duration-200" x-transition:leave-end="translate-x-5 opacity-0"
             class="toast-card pointer-events-auto {% if message.tags == 'success' %}border-emerald-200{% elif message.tags == 'error' %}border-rose-200{% elif message.tags == 'warning' %}border-amber-200{% else %}border-blue-200{% endif %}"
             role="status">
            <span class="grid size-9 shrink-0 place-items-center rounded-xl {% if message.tags == 'success' %}bg-emerald-50 text-emerald-600{% elif message.tags == 'error' %}bg-rose-50 text-rose-600{% elif message.tags == 'warning' %}bg-amber-50 text-amber-600{% else %}bg-blue-50 text-blue-600{% endif %}"><i
                    data-lucide="{% if message.tags == 'success' %}circle-check{% elif message.tags == 'error' %}circle-x{% elif message.tags == 'warning' %}triangle-alert{% else %}info{% endif %}"
                    class="size-5"></i></span>
            <div class="min-w-0 pt-0.5">
                <div class="text-sm font-bold">{% if message.tags == 'success' %}
                    Success{% elif message.tags == 'error' %}Something went wrong{% elif message.tags == 'warning' %}
                    Heads up{% else %}Notice{% endif %}</div>
                <p class="mt-0.5 text-sm leading-5 text-slate-500">{{ message }}</p></div>
            <button @click="show = false"
                    class="absolute right-3 top-3 rounded-lg p-1 text-slate-400 hover:bg-slate-100 hover:text-slate-700"
                    aria-label="Dismiss notification"><i data-lucide="x" class="size-4"></i></button>
            <div class="absolute inset-x-0 bottom-0 h-1 bg-slate-100">
                <div class="h-full animate-[toast-progress_5s_linear_forwards] {% if message.tags == 'success' %}bg-emerald-500{% elif message.tags == 'error' %}bg-rose-500{% elif message.tags == 'warning' %}bg-amber-500{% else %}bg-blue-500{% endif %}"></div>
            </div>
        </div>
    {% endfor %}
</div>
