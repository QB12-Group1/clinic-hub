<div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
    <div>
        {% if eyebrow %}
            <div class="eyebrow">{{ eyebrow }}</div>{% endif %}
        <h1 class="mt-1 text-2xl font-extrabold tracking-tight">{{ page_title }}</h1>
        {% if page_description %}<p class="mt-2 max-w-2xl text-sm text-slate-500">{{ page_description }}</p>{% endif %}
    </div>
    {% if primary_action %}<a href="{{ primary_action.url }}" class="btn btn-primary"><i
            data-lucide="{{ primary_action.icon|default:'plus' }}" class="mr-1 size-4"></i>{{ primary_action.label }}
    </a>{% endif %}
</div>
