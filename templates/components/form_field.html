{% load ui %}
<div class="rounded-xl border border-transparent p-1 transition focus-within:border-primary/10">
  <label class="field-label flex items-center justify-between" for="{{ field.id_for_label }}"><span>{{ field.label }}</span>{% if field.field.required %}<span class="rounded-full bg-error/10 px-2 py-0.5 text-[10px] font-bold uppercase tracking-wide text-error">Required</span>{% endif %}</label>
  {{ field|ui_field }}
  {% if field.help_text %}<p class="mt-2 flex items-start gap-1.5 text-xs leading-5 text-slate-400"><i data-lucide="info" class="mt-0.5 size-3.5 shrink-0"></i>{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="mt-2 flex items-center gap-1.5 text-xs font-semibold text-error"><i data-lucide="circle-alert" class="size-3.5"></i>{{ error }}</p>{% endfor %}
</div>
