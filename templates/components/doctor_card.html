<div class="flex items-center gap-3 rounded-xl bg-slate-50 p-3">
    <div class="avatar placeholder">
        <div class="w-11 rounded-full bg-{{ doctor.tone }}/15 text-{{ doctor.tone }}"><span>{{ doctor.initials }}</span>
        </div>
    </div>
    <div class="min-w-0">
        <div class="truncate font-bold">{{ doctor.name }}</div>
        <div class="text-xs text-slate-500">{{ doctor.specialty }}</div>
    </div>
    <span class="ml-auto size-2 rounded-full bg-emerald-400" title="Available"></span>
</div>
