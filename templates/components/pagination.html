{% if page_obj and page_obj.paginator.num_pages > 1 %}
<div class="flex items-center justify-between border-t border-slate-100 px-2 pt-4 text-sm">
  <span class="text-slate-500">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  <div class="join">{% if page_obj.has_previous %}<a class="btn btn-sm join-item" href="?page={{ page_obj.previous_page_number }}">Previous</a>{% else %}<span class="btn btn-sm join-item btn-disabled">Previous</span>{% endif %}{% if page_obj.has_next %}<a class="btn btn-sm join-item" href="?page={{ page_obj.next_page_number }}">Next</a>{% else %}<span class="btn btn-sm join-item btn-disabled">Next</span>{% endif %}</div>
</div>
{% endif %}
